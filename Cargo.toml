[package]
name = "cpu-guardian"
version = "0.1.0"
edition = "2021"
description = "Controlador de carga e freio de emergência de CPU para Linux"
license = "MIT"

[dependencies]
anyhow = "1.0"
ctrlc = "3.4"
nix = { version = "0.29", features = ["process", "sched", "signal"] }
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.30"
toml = "0.8"
