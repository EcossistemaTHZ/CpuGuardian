# Perfil recomendado para Intel Core i5-2450M (2 Cores / 4 Threads - Sandy Bridge)
# Otimizado para máxima estabilidade térmica e prevenção de congelamentos com ZRAM

dry_run = false
sample_interval_ms = 1000

# Limiares de CPU para o i5-2450M:
high_cpu_percent = 90.0
# Fallback quando nenhum sensor térmico estiver disponível.
panic_cpu_percent = 99.0
low_cpu_percent = 70.0

# Sandy Bridge: controle guiado por temperatura real via coretemp/hwmon.
thermal_high_celsius = 82.0
thermal_panic_celsius = 90.0
thermal_emergency_celsius = 97.0

# Carga alta comum preserva as 4 threads. Sob calor, mantém 3 de 4 threads.
throttle_cpu_percent = 100
panic_cpu_percent_limit = 75

# Proteção de memória para trabalhar em harmonia com ZRAM:
# Se a memória física disponível cair para menos de 8%, aciona freio preventivo para dar tempo ao ZRAM
min_available_memory_percent = 8.0

# Amostras para ação:
high_samples_before_action = 8
# Sem sensor, só limita após 30 s contínuos em 99%; evita punir builds normais cedo demais.
panic_samples_before_action = 30
low_samples_before_restore = 8

minimum_process_cpu_percent = 25.0
max_managed_processes = 1

# Modo dinâmico: SCHED_BATCH sob carga; afinidade só com calor; SIGSTOP só em emergência.
action = "dynamic"

exclude = [
  "systemd", "systemd-journald", "systemd-udevd", "kthreadd", "init",
  "dbus-daemon", "dbus-broker", "sshd", "NetworkManager",
  "Xorg", "wayland", "gnome-shell", "kwin_wayland", "kwin_x11",
  "sway", "hyprland", "mutter",
  "pipewire", "pipewire-pulse", "wireplumber", "pulseaudio",
  "bash", "zsh", "fish", "cpu-guardian", "earlyoom"
]
